<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop-up Window</title>
    <script>
        let popupWindow;

        function openPopup() {
            popupWindow = window.open("", "Popup", "width=400,height=300");
            popupWindow.document.write("<h1>This is a Pop-up Window!</h1>");
            popupWindow.document.write("<p>Close by clicking the button below.</p>");
            popupWindow.document.write("<button onclick='window.close()'>Close</button>");
        }
    </script>
</head>
<body>
    <h1>Pop-up Window</h1>
    <button onclick="openPopup()">Open Pop-up</button>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
