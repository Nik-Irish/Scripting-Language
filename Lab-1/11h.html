<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigator Object</title>
</head>
<body>
    <div id="info"></div>
    <script>
        const info = document.getElementById('info');

        // Displaying navigator properties
        info.innerHTML += '<p><strong>App Name:</strong> ' + navigator.appName + '</p>';
        info.innerHTML += '<p><strong>App Version:</strong> ' + navigator.appVersion + '</p>';
        info.innerHTML += '<p><strong>User Agent:</strong> ' + navigator.userAgent + '</p>';
        info.innerHTML += '<p><strong>Platform:</strong> ' + navigator.platform + '</p>';
        info.innerHTML += '<p><strong>Language:</strong> ' + navigator.language + '</p>';

        // Checking if the browser is online
        if (navigator.onLine) {
            info.innerHTML += '<p>You are online!</p>';
        } else {
            info.innerHTML += '<p>You are offline!</p>';
        }

        // Displaying the browser's cookie enabled status
        info.innerHTML += '<p><strong>Cookies Enabled:</strong> ' + navigator.cookieEnabled + '</p>';
    </script>

</body>
</html>
