<!DOCTYPE html>
<html lang="en">
<body>
    <h1>Factorial Calculator</h1>
    <input type="number" id="num" placeholder="Enter a number" />
    <button onclick="cf()">Calculate Factorial</button>
    <p id="result"></p>

    <script>
        function cf() {
            const n = document.getElementById('num').value;
            const r = factorial(n);
            document.getElementById('result').innerText = 'Factorial of ' + n + ' is ' + r;
        }

        function factorial(n) {
            let f = 1;
            for (let i = 1; i <= n; i++) {
                f *= i;
            }
            return f;
        }
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
