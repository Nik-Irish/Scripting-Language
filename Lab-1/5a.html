<!DOCTYPE html>
<html lang="en">
<body>
    <h1>Function Declaration and Function Expression</h1>

    <script>
        // Function Declaration
        function greet() {
            return "Hello one";
        }

        // Function Expression
        const greetExpression = function() {
            return "Hello two";
        };

        // Displaying the results
        document.write(greet() + "<br>");
        document.write(greetExpression());
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
