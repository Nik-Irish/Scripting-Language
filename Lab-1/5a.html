<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Declaration and Expression</title>
</head>
<body>
    <h1>Function Declaration and Function Expression</h1>

    <script>
        // Function Declaration
        function greet() {
            return "Hello from Function Declaration!";
        }

        // Function Expression
        const greetExpression = function() {
            return "Hello from Function Expression!";
        };

        // Displaying the results
        document.write(greet() + "<br>");
        document.write(greetExpression());
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
