<!DOCTYPE html>
<html lang="en">
<body>
    <h2>Arguments in JS are Passed by Value</h2>
    <script>
        // Function to change the value of the parameter 'num'
        function changeValue(a) {
            a = 10; // Assigns the value 10 to 'a'
            return a; // Returns the modified value of 'a'
        }

        let ov = 5; // Initializes 'originalValue' with 5
        let nv = changeValue(ov); // Calls 'changeValue' with 'originalValue'

        document.write("Original Value: " + ov + "<br>"); // Displays the original value
        document.write("New Value: " + nv + "<br>"); // Displays the new value returned by the function
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
