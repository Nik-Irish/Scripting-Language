<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Difference Between == and ===</title>
</head>
<body>
    <script>
        let a = '5';
        let b = 5;

        document.write("<h2>Using == Operator</h2>");
        document.write("<p>a == b: " + (a == b) + "</p>"); // true, because it converts '5' to 5

        document.write("<h2>Using === Operator</h2>");
        document.write("<p>a === b: " + (a === b) + "</p>"); // false, because types are different
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
