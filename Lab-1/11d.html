<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetInterval and ClearInterval</title>
    <style>
        #counter {
            font-size: 50px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div id="counter">0</div>
    <button id="startb">Start</button>
    <button id="stopb">Stop</button>

    <script>
        let c = 0;
        let iv;
        
        document.getElementById('startb').addEventListener('click', function() {
            iv = setInterval(function() {
                c++;
                document.getElementById('counter').innerText = c;
            }, 1000);
        });

        document.getElementById('stopb').addEventListener('click', function() {
            clearInterval(iv);
            iv = null;
        });
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
