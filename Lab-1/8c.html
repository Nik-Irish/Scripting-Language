<!DOCTYPE html>
<html lang="en">  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Object Setter Methods</title>
</head>
<body>
    <!--This is a code no need to be changed-->
    <div id="dd"></div>
    <script>
        const d = new Date();

        d.setDate(15);
        d.setDay(3); // Setting to Tuesday
        d.setFullYear(2023);
        d.setHours(10);
        d.setMonth(5); // June (months are 0-indexed)
        d.setMilliseconds(500);
        d.setSeconds(30);
        d.setMinutes(45);
        d.setYear(2023); // Deprecated, use setFullYear instead
        d.setUTCFullYear(2023);
        d.setUTCDay(3); // Setting to Tuesday in UTC
        d.setUTCDate(15);
        d.setUTCMonth(5); // June in UTC

        document.getElementById('dd').innerText = d.toUTCString();
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
