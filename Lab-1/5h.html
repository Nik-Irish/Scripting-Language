<!DOCTYPE html>
<html lang="en">
<body>
    <h1>Rest Parameters in js</h1>
    <script>
        function s(...numbers) {
            return numbers.reduce((acc, curr) => acc + curr, 0);
        }

        const result = s(1, 2, 3, 4, 5);
        document.write('The sum of the numbers is: ' + result + '<br>');
    </script>

</body>
</html>
