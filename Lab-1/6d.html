<!DOCTYPE html>
<html lang="en">
<body>
    <h3>Delete Property in js object</h3>
    <script>
        // Creating a JavaScript object
        let p = {
            name: "MAX",
            age: 18,
            city: "Paris"
        };
        document.write("Before deletion: <br>");
        document.write("Name: " + p.name + "<br> Age: " + p.age + "<br> City: " + p.city + "<br><br>");
        // Deleting the 'age' property
        delete p.age;

            // Displaying the updated object
        document.write("After deletion: <br>");
        document.write("Name: " + p.name + "<br> Age: " + p.age + "<br> City: " + p.city + "<br>");
    </script>

</body>
</html>
