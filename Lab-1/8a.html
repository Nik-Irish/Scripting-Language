<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Object Examples</title>
</head>
<body>
    <h1>Date Object</h1>
    <div id="DE"></div>

    <script>
        const de = document.getElementById('DE');

        // 1. Using the Date constructor
        const a = new Date();
        de.innerHTML += '<p>Current Date: ' + a + '</p>';

        // 2. Using a specific date
        const b = new Date('2025-12-30');
        de.innerHTML += '<p>Specific Date: ' + b + '</p>';

        // 3. Using year, month, day
        const c = new Date(2026, 3, 18); // Note: Month is 0-indexed
        de.innerHTML += '<p>Year, Month, Day: ' + c + '</p>';

        // 4. Using timestamp
        const d = new Date(1776118468635); // Example timestamp
        de.innerHTML += '<p>Timestamp Date: ' + d + '</p>';

        // 5. Using UTC date
        const e = new Date(Date.UTC(2026, 3, 18));
        de.innerHTML += '<p>UTC Date: ' + e + '</p>';
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
