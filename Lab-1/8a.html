<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Object Examples</title>
</head>
<body>
    <h1>Date Object</h1>
    <div id="dateExamples"></div>

    <script>
        const dateExamples = document.getElementById('dateExamples');

        // 1. Using the Date constructor
        const date1 = new Date();
        dateExamples.innerHTML += '<p>Current Date: ' + date1 + '</p>';

        // 2. Using a specific date
        const date2 = new Date('2025-12-30');
        dateExamples.innerHTML += '<p>Specific Date: ' + date2 + '</p>';

        // 3. Using year, month, day
        const date3 = new Date(2026, 3, 18); // Note: Month is 0-indexed
        dateExamples.innerHTML += '<p>Year, Month, Day: ' + date3 + '</p>';

        // 4. Using timestamp
        const date4 = new Date(1776118468635); // Example timestamp
        dateExamples.innerHTML += '<p>Timestamp Date: ' + date4 + '</p>';

        // 5. Using UTC date
        const date5 = new Date(Date.UTC(2026, 3, 18));
        dateExamples.innerHTML += '<p>UTC Date: ' + date5 + '</p>';
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
