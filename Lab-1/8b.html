<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Object Getters</title>
</head>
<body>
    <h1>Date Object Getter Methods</h1>
    <div id="date-info"></div>

    <script>
        const d = new Date();
        const dateInfo = `
            <p>Current Date: ${d.getDate()}</p>
            <p>Current Day: ${d.getDay()}</p>
            <p>Current Year: ${d.getFullYear()}</p>
            <p>Current Hours: ${d.getHours()}</p>
            <p>Current Month: ${d.getMonth()}</p>
            <p>Current Milliseconds: ${d.getMilliseconds()}</p>
            <p>Current Seconds: ${d.getSeconds()}</p>
            <p>Current Minutes: ${d.getMinutes()}</p>
            <p>Timezone Offset: ${d.getTimezoneOffset()}</p>
            <p>Current Year (1970): ${d.getYear()}</p>
            <p>Current UTC Year: ${d.getUTCFullYear()}</p>
            <p>Current UTC Day: ${d.getUTCDay()}</p>
            <p>Current UTC Date: ${d.getUTCDate()}</p>
            <p>Current UTC Month: ${d.getUTCMonth()}</p>
        `;
        document.getElementById('date-info').innerHTML = dateInfo;
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
