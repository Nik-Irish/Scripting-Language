<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Object Getters</title>
</head>
<body>
    <h1>Date Object Getter Methods</h1>
    <div id="date-info"></div>

    <script>
        const date = new Date();
        const dateInfo = `
            <p>Current Date: ${date.getDate()}</p>
            <p>Current Day: ${date.getDay()}</p>
            <p>Current Year: ${date.getFullYear()}</p>
            <p>Current Hours: ${date.getHours()}</p>
            <p>Current Month: ${date.getMonth()}</p>
            <p>Current Milliseconds: ${date.getMilliseconds()}</p>
            <p>Current Seconds: ${date.getSeconds()}</p>
            <p>Current Minutes: ${date.getMinutes()}</p>
            <p>Timezone Offset: ${date.getTimezoneOffset()}</p>
            <p>Current Year (1970): ${date.getYear()}</p>
            <p>Current UTC Year: ${date.getUTCFullYear()}</p>
            <p>Current UTC Day: ${date.getUTCDay()}</p>
            <p>Current UTC Date: ${date.getUTCDate()}</p>
            <p>Current UTC Month: ${date.getUTCMonth()}</p>
        `;
        document.getElementById('date-info').innerHTML = dateInfo;
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
