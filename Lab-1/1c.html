<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type of Variables</title>
</head>
<body>
    <h1>Variable Types</h1>
    <script>
        var numberVar = 42;
        var stringVar = "Hello, World!";
        var booleanVar = true;
        var arrayVar = [1, 2, 3];
        var objectVar = { key: "value" };
        var nullVar = null;
        var undefinedVar;

        document.write("<p>Type of numberVar: " + typeof numberVar + "</p>");
        document.write("<p>Type of stringVar: " + typeof stringVar + "</p>");
        document.write("<p>Type of booleanVar: " + typeof booleanVar + "</p>");
        document.write("<p>Type of arrayVar: " + typeof arrayVar + "</p>");
        document.write("<p>Type of objectVar: " + typeof objectVar + "</p>");
        document.write("<p>Type of nullVar: " + typeof nullVar + "</p>");
        document.write("<p>Type of undefinedVar: " + typeof undefinedVar + "</p>");
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
