<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Digits</title>
    <script>
        function sumOfDigits() {
            let a = prompt("Please enter a number:");
            let s = 0;

            while (a > 0) {
                s += a % 10;
                a = Math.floor(a / 10);
            }

            alert("The sum of the digits is: " + s);
        }
    </script>
</head>
<body>
    <h1>Sum of Digits</h1>
    <button onclick="sumOfDigits()">Calculate Sum of Digits</button>

</body>
</html>
