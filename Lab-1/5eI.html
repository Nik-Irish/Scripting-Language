    <title>Find Smallest Number</title>
</head>
<body>
    <h2>Find the Smallest Number</h2>
    <script>
        function findSmallest(num1, num2, num3) {
            return Math.min(num1, num2, num3);
        }

        const smallest = findSmallest(10, 5, 8);
        document.write("The smallest number is: " + smallest);
    </script>
