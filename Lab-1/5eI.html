<!DOCTYPE html>
<html lang="en">
<body>
    <h2>Find the Smallest Number</h2>
    <script>
        function fs(a, b, c) {
            return Math.min(a, b, c);
        }

        const s = fs(10, 5, 8);
        document.write("The smallest number is: " + s);
    </script>
