<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Dimensions</title>
</head>
<body>
    <button onclick="showDimensions()">Show Dimensions</button>

    <script>
        function showDimensions() {
            const innerWidth = window.innerWidth;
            const innerHeight = window.innerHeight;
            const outerWidth = window.outerWidth;
            const outerHeight = window.outerHeight;
            alert('Inner Width: ' + innerWidth + 'px\nInner Height: ' + innerHeight + 'px\nOuter Width: ' + outerWidth + 'px\nOuter Height: ' + outerHeight + 'px');
        }
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
