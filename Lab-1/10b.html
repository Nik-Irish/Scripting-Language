<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple calc</title>
    <script>
        
        function add() {
            var a = parseFloat(document.getElementById("a").value);
            var b = parseFloat(document.getElementById("b").value);
            alert("Result: " + (a + b));
        }

        function subtract() {
            var a = parseFloat(document.getElementById("a").value);
            var b = parseFloat(document.getElementById("b").value);
            alert("Result: " + (a - b));
        }

        function multiply() {
            var a = parseFloat(document.getElementById("a").value);
            var b = parseFloat(document.getElementById("b").value);
            alert("Result: " + (a * b));
        }
    </script>
</head>
<body>
    <h1>simple calc</h1>
    Enter the first number: <input type="text" id="a"><br><br>
    Enter the second number: <input type="text" id="b"><br><br>
    <button onclick="add()">Add</button>
    <button onclick="subtract()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
<P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>

</html>
