<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Object</title>
</head>
<body>
    <iframe id="Frame" src="6a.html" width="600" height="400"></iframe>
    <button onclick="changeFrameSrc()">Change Frame Source</button>
    <button onclick="getFrameDetails()">Get Frame Details</button>

    <script>
        function changeFrameSrc() {
            const frame = document.getElementById('Frame');
            frame.src = "https://www.wikipedia.org";
        }

        function getFrameDetails() {
            const frame = document.getElementById('Frame');
            alert("Frame Source: " + frame.src + "\nFrame Width: " + frame.width + "\nFrame Height: " + frame.height);
        }
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
