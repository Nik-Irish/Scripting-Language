<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Object Example</title>
</head>
<body>
    <script>
        const ob = {
            name: "Nik Dulal",
            age: 21,
            greet: function() {
                return 'Hello, my name is ' + this.name;
            },
            address: {
                city: "BIR",
                country: "Nepal"
            },
            hobbies: ["Reading", "Traveling", "Coding"]
        };

        // Accessing properties
        document.write("Name: " + ob.name + "<br>"); // Nik Dulal
        document.write("Age: " + ob.age + "<br>"); // 21
        document.write("Greeting: " + ob.greet() + "<br>"); // Hello, my name is Nik Dulal
        document.write("City: " + ob.address.city + "<br>"); // BIR
        document.write("Hobby: " + ob.hobbies[1] + "<br>"); // Traveling
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
