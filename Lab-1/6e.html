<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Object Example</title>
</head>
<body>
    <script>
        const myObject = {
            name: "Nik Dulal",
            age: 21,
            greet: function() {
                return 'Hello, my name is ' + this.name;
            },
            address: {
                city: "BIR",
                country: "Nepal"
            },
            hobbies: ["Reading", "Traveling", "Coding"]
        };

        // Accessing properties
        document.write("Name: " + myObject.name + "<br>"); // John Doe
        document.write("Age: " + myObject.age + "<br>"); // 30
        document.write("Greeting: " + myObject.greet() + "<br>"); // Hello, my name is John Doe
        document.write("City: " + myObject.address.city + "<br>"); // New York
        document.write("Hobby: " + myObject.hobbies[1] + "<br>"); // traveling
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
