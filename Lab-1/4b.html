<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Example</title>
</head>
<body>
    <h1>Two-Dimensional Array</h1>
    <script>
        let a = [
            [1, 2, 3],
            [4, 5, 6],
            [7, 8, 9]
        ];

        document.write("Element at (1, 2): " + a[1][2] + "<br>"); // Outputs 6
    </script>

    <h1>Three-Dimensional Array</h1>
    <script>
        let b = [
            [
                [1, 2],
                [3, 4]
            ],
            [
                [5, 6],
                [7, 8]
            ]
        ];

        document.write("Element at (1, 0, 1): " + b[1][0][1] + "<br>"); // Outputs 6
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
