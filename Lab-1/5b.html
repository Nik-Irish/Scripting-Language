<!DOCTYPE html>
<html lang="en">
<body>
    <h1>Anonymous and Arrow Functions in JS</h1>
    <div id="output"></div>

    <script>
        // Anonymous Function
        const a = function(name) {
            return 'Hello, ' + name + '! This is an anonymous function.';
        };

        // Arrow Function
        const b = (name) => {
            return 'Hello, ' + name + '! This is an arrow function.';
        };

        // Output results
        document.getElementById('output').innerHTML = `
            <p>${a('Ram')}</p>
            <p>${b('Nik')}</p>
        `;
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
