<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        function ceo() {
            var a = parseInt(document.getElementById("num1").value);
            var b = parseInt(document.getElementById("num2").value);
            var s = a + b;
            var r = (s % 2 === 0) ? "even" : "odd";
            document.getElementById("result").innerText = "The sum is " + r + ".";
        }
    </script>
</head>
<body>
    <h1>Check Sum is Even or Odd</h1>
    <input type="number" id="num1" placeholder="Enter first number"> +
    <input type="number" id="num2" placeholder="Enter second number">
    <button onclick="ceo()">Check</button>
    <p id="result"></p>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
