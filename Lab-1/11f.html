<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Object Methods</title>
</head>
<body>
    <h1>Location Object Methods</h1>
    <button onclick="assignExample()">Assign</button>
    <button onclick="replaceExample()">Replace</button>
    <button onclick="reloadExample()">Reload</button>

    <script>
        function assignExample() {
            window.location.assign("https://www.youtube.com");
        }

        function replaceExample() {
            window.location.replace("https://www.facebook.com");
        }

        function reloadExample() {
            window.location.reload();
        }
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
