<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Event Handling</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input {
            padding: 10px;
            font-size: 16px;
        }
        p {
            font-size: 18px;
            color: green;
        }
    </style>
</head>
<body>

    <h1>Input Event Handling</h1>
    <input type="text" id="inputField">
    <p id="output"></p>

    <script>
        const inputField = document.getElementById('inputField');
        const output = document.getElementById('output');

        inputField.addEventListener('input', function() {
            output.textContent = 'I typed: ' + inputField.value;
        });
    </script>
<P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
