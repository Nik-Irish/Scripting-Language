<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Sequence</title>
</head>
<body>
    <h1>Fibonacci Sequence</h1>
    <div id="fibonacci"></div>

    <script>
        function fibonacci(n) {
            if (n <= 0) return [];
            if (n === 1) return [0];
            if (n === 2) return [0, 1];
            const seq = fibonacci(n - 1);
            seq.push(seq[seq.length - 1] + seq[seq.length - 2]);
            return seq;
        }

        function displayFibonacci(n) {
            const fibSeq = fibonacci(n);
            document.getElementById('fibonacci').innerText = 'Fibonacci sequence up to ' + n + ' terms: ' + fibSeq.join(', ');
        }

        displayFibonacci(7);
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
