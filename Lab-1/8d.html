<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
</head>
<body>
    <h1>Age Calculator</h1>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob">
    <button onclick="calculateAge()">Calculate</button>

    <h3>Results:</h3>
    <p id="yearsResult"></p>
    <p id="detailResult"></p>

    <script>
        function calculateAge() {
            let dob = new Date(document.getElementById('dob').value);
            let today = new Date();            

            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();
            let days = today.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                // Get days in previous month
                let prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('yearsResult').innerText = "Age: " + years + " years old";
            document.getElementById('detailResult').innerText = "Age in details: " + years + " years, " + months + " months, and " + days + " days";
        }
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
