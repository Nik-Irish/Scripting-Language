<!DOCTYPE html>
<html lang="en">
<body>
    <h1>Age Calculator</h1>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob">
    <button onclick="calculateAge()">Calculate</button>

    <h3>Results:</h3>
    <p id="yearsResult"></p>
    <p id="detailResult"></p>

    <script>
        function calculateAge() {
            let dob = new Date(document.getElementById('dob').value);
            let t = new Date();            

            let y = t.getFullYear() - dob.getFullYear();
            let m = t.getMonth() - dob.getMonth();
            let d = t.getDate() - dob.getDate();

            if (d < 0) {
                m--;
                // Get days in previous month
                let prevMonth = new Date(t.getFullYear(), t.getMonth(), 0);
                d += prevMonth.getDate();
            }

            if (m < 0) {
                y--;
                m += 12;
            }

            document.getElementById('yearsResult').innerText = "Age: " + y + " years old";
            document.getElementById('detailResult').innerText = "Age in details: " + y + " years, " + m + " months, and " + d + " days";
        }
    </script>

</body>
</html>
