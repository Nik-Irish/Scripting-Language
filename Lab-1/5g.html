<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arguments Object in JS Function</title>
</head>
<body>
    <button onclick="d('Hello', 'World', 2006)">Click Me!</button>
    <p id="o"></p>

    <script>
        function d() {
            let a = "Arguments: ";
            for (let i = 0; i < arguments.length; i++) {
                a += arguments[i] + " ";
            }
            document.getElementById("o").innerText = a;
        }
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
