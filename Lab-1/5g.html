<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arguments Object in JS Function</title>
</head>
<body>
    <button onclick="displayArguments('Hello', 'World', 2067)">Click Me!</button>
    <p id="output"></p>

    <script>
        function displayArguments() {
            let output = "Arguments: ";
            for (let i = 0; i < arguments.length; i++) {
                output += arguments[i] + " ";
            }
            document.getElementById("output").innerText = output;
        }
    </script>

</body>
</html>
