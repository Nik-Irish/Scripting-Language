<!DOCTYPE html>
<html lang="en">
<body>
    <h1>Default Parameters in JS</h1>
    <script>
        function g(name = "Guest", greeting = "Hello") {
            return'   '+ greeting + ', ' + name + '!';
        }

        document.addEventListener("DOMContentLoaded", function() {
            const m1 = g();
            const m2 = g("Alice");
            const m3 = g("Bob", "Welcome");

            document.body.innerHTML += '<p>' + m1 + '</p>';
            document.body.innerHTML += '<p>' + m2 + '</p>';
            document.body.innerHTML += '<p>' + m3 + '</p>';
        });
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
