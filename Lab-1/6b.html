<!DOCTYPE html>
<html lang="en">
<body>
    <h1>Demonstrating Object Creation</h1>
    <script>
        // Parent object
        const animal = {
            eats: true
        };

        // Creating a new object using Object.create()
        const rabbit = Object.create(animal);
        rabbit.hops = true;

        document.write("Does Rabbit Eat?:<br>" + rabbit.eats + "<br>"); // true
        document.write("Does Rabbit Hop?:<br>" + rabbit.hops + "<br>"); // true
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
