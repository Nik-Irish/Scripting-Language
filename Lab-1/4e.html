<!DOCTYPE html>
<html lang="en">
<body>
    <h1>Delete Element from Array</h1>
    <script>
        let a = [10, 20, 30, 40, 50];
        let p = prompt("Enter the position of the element to delete (0 to " + (a.length - 1) + "):");

        if (p >= 0 && p < a.length) {
            a.splice(p, 1);
            alert("Updated array: " + a);
        } else {
            alert("Invalid position!");
        }
    </script>

</body>
</html>
