<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First 10 Odd Numbers</title>
</head>
<body>
    <h1>First 10 Odd Numbers</h1>
    <ul id="onl"></ul>

    <script>
        function don() {
            const oddlist = document.getElementById('onl');
            for (let i = 1; i <= 20; i += 2) {
                const lt = document.createElement('li');
                lt.textContent = i;
                oddlist.appendChild(lt);
            }
        }

        don();
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
