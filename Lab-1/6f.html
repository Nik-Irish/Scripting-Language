<!DOCTYPE html>
<html lang="en">
<body>
    <h1>Getters and Setters in Js</h1>
    <script>
        const p = {
            fn: 'John',
            ln: 'Dom',
            get fuln() {
                return 'Hello, my name is ' + this.fn + ' ' + this.ln;
            },
            set fuln(name) {
                const parts = name.split(' ');
                this.fn = parts[0];
                this.ln = parts[1];
            }
        };

        document.write("Full Name: " + p.fuln + "<br>"); // John Doe
        p.fuln = 'Jame Smith';
        document.write("First Name: " + p.fn + "<br>"); // Jane
        document.write("Last Name: " + p.ln + "<br>"); // Smith
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
