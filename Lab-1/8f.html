<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Calculator</title>
</head>
<body>
    <h1>Date Calculator</h1>
    <label for="days">Enter Days:</label>
    <input type="number" id="days">
    <br>
    <label for="hours">Enter Hours:</label>
    <input type="number" id="hours">
    <br>
    <button onclick="CDates()">Calculate</button>
    <h2>Results:</h2>
    <p id="bd"></p>
    <p id="ad"></p>

    <script>
        function CDates() {
            const days = parseInt(document.getElementById('days').value);
            const hours = parseInt(document.getElementById('hours').value);
            const cd = new Date();
            const bd = new Date(cd);
            const ad = new Date(cd);

            bd.setDate(cd.getDate() - days);
            bd.setHours(cd.getHours() - hours);
            ad.setDate(cd.getDate() + days);
            ad.setHours(cd.getHours() + hours);

            document.getElementById('bd').innerText = 'Date before: ' + bd.toString();
            document.getElementById('ad').innerText = 'Date after: ' + ad.toString();
        }
    </script>
    <P>Lab-1/Nikrish Dulal/BCA/A/4rth</P>
</body>
</html>
