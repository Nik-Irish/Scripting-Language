<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Event Handling</title>
    <style>
        #eventBox {
            width: 150px;
            height: 100px;
            border: 2px solid #000;
            display: flex;
            align-items: top;
            justify-content: center;
            margin: 20px;
            transition: background-color 0.1s;
        }
    </style>
</head>
<body>

<div id="eventBox">Touch Pad</div>
<p id="eventInfo"></p>

<script>
    const eb = document.getElementById('eventBox');
    const ei = document.getElementById('eventInfo');

    eb.addEventListener('click', () => {
        ei.textContent = 'Box Clicked!';
    });

    eb.addEventListener('mouseover', () => {
        eb.style.backgroundColor = 'lightblue';
        ei.textContent = 'Mouse Over!';
    });

    eb.addEventListener('mouseout', () => {
        eb.style.backgroundColor = '';
        ei.textContent = 'Mouse Out!';
    });

    eb.addEventListener('mousedown', () => {
        ei.textContent = 'Mouse Down!';
    });

    eb.addEventListener('mouseup', () => {
        ei.textContent = 'Mouse Up!';
    });

    eb.addEventListener('mousemove', (event) => {
        ei.textContent = 'Mouse Position: X: ' + event.clientX + ', Y: ' + event.clientY;
    });
</script>

</body>
</html>
