<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form id="registrationForm">
        <label for="firstName">First Name (required):</label>
        <input type="text" id="firstName" name="firstName" required>
        <span class="error" id="firstNameError"></span><br><br>

        <label for="lastName">Last Name (optional):</label>
        <input type="text" id="lastName" name="lastName">
        <span class="error" id="lastNameError"></span><br><br>

        <label for="dob">Date of Birth (required):</label>
        <input type="date" id="dob" name="dob" required>
        <span class="error" id="dobError"></span><br><br>

        <label for="gender">Gender (required):</label>
        <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
        <span class="error" id="genderError"></span><br><br>

        <label for="provenience">Provenience (required):</label>
        <select id="provenience" name="provenience" required>
            <option value="">Select</option>
            <option value="province1">Koshi Province</option>
            <option value="province2">Madesh Province</option>
            <option value="province3">Bagmati Province</option>
            <option value="province4">Gandaki Province</option>
            <option value="province5">Lumbini Province</option>
            <option value="province6">Karnali Province</option>
            <option value="province7">Sudurpashchim Province</option>
        </select>
        <span class="error" id="provenienceError"></span><br><br>

        <label for="district">District (required):</label>
        <select id="district" name="district" required>
            <option value="">Select</option>
        </select>
        <span class="error" id="districtError"></span><br><br>

        <label for="cellPhone">Cell Phone (required):</label>
        <input type="text" id="cellPhone" name="cellPhone" required>
        <span class="error" id="cellPhoneError"></span><br><br>

        <label for="email">Email Address (optional):</label>
        <input type="email" id="email" name="email">
        <span class="error" id="emailError"></span><br><br>

        <label for="userName">User Name (required):</label>
        <input type="text" id="userName" name="userName" required>
        <span class="error" id="userNameError"></span><br><br>

        <label for="password">Password (required):</label>
        <input type="password" id="password" name="password" required>
        <span class="error" id="passwordError"></span><br><br>

        <label for="confirmPassword">Confirm Password (required):</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        <span class="error" id="confirmPasswordError"></span><br><br>

        <button type="submit">Register</button>
    </form>

    <script src="16b.js"></script>
</body>
</html>
