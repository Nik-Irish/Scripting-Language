<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Node Properties</title>
</head>
<body>
    <div id="a">
        <p>This is a paragraph.</p>
        <span>This is a span.</span>
    </div>
    <script>
        const b = document.getElementById('a');
        
        document.write('nodeName:', b.nodeName);
        document.write('nodeType:', b.nodeType);
        document.write('lastChild:', b.lastChild);
        document.write('nodeValue:', b.nodeValue);
        document.write('parentNode:', b.parentNode);
        document.write('nextSibling:', b.nextSibling);
        document.write('previousSibling:', b.previousSibling);
        document.write('childNodes:', b.childNodes);
        document.write('firstChild:', b.firstChild);
    </script>
</body>
</html>
