<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlight Long Words</title>
    <style>
        .highlight {
            background-color: red;
        }
    </style>
</head>
<body>
    <p id="text">Wikipedia is hosted by the Wikimedia Foundation, a non-profit organization that also hosts a range of other projects.</p>
    <button id="highlightButton">Highlight Long Words</button>

    <script>
        document.getElementById('highlightButton').addEventListener('click', function() {
            const paragraph = document.getElementById('text');
            const words = paragraph.innerText.split(' ');
            const highlightedWords = words.map
            (word => 
            {
                return word.length > 8 ? '<span class="highlight">' + word + '</span>' : word;
            });
            paragraph.innerHTML = highlightedWords.join(' ');
        });
    </script>
</body>
</html>
